name = "agpro-v2"
account_id = "0e528c886015cce349076fb7db222a88"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# SvelteKit with @sveltejs/adapter-cloudflare output
pages_build_output_dir = ".svelte-kit/cloudflare"

[vars]
APP_NAME = "AgPro Management Systems"
APP_ENV = "production"
IOWA_SEED_AUDIT_ENABLED = "true"

# Primary Cloudflare D1 SQL Engine
[[d1_databases]]
binding = "DB"
database_name = "agpro-v2-prod"
database_id = "f5315046-250a-4f80-9d89-91fed09ce8a7"
migrations_dir = "./drizzle/migrations"

# Object Storage for BOL Documents, Invoices, and Check PDFs
[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "agpro-documents"
preview_bucket_name = "agpro-documents"

# Observability and Logging
[observability]
enabled = true
